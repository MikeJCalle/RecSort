[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsort"
version = "0.1.0"
description = "Recursive sort expression compiler — declare nested sort logic in .nst, emit clean Python."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.9"
keywords = ["sorting", "compiler", "nested", "data", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

[project.scripts]
recsort = "recsort.compiler:main"

[project.urls]
Homepage = "https://github.com/your-username/recsort"
Issues   = "https://github.com/your-username/recsort/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["recsort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
